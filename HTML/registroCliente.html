<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa de Ayuda - Registro de Cliente</title>
    <style type="text/css">
        label {
            font-size: 18px;
        }
        form {
            width: 500px;
            border: 1px solid black;
            padding: 20px;
        }
        input {
            margin: 7px;
            padding: 5px;
        }
        .txt {
            display: inline-block;
            width: 340px;
            outline: none;
        }
    </style>
</head>

<body>
    <center>
        <img src="HelpDeskGirl.png" alt="Nuestra imagen corporativa" style="width:200px;height:150px;">
        <h1>Sistema de Mesa de Ayuda</h1>
        <h2>Crear Cuenta de Cliente</h2>
    </center>

    <center>
        <form id="registroForm" style="background-color:#d8f7cf">
            <table>
                <tr style="height:10px;">
                    <td><label for="nombre" class="form-label">Nombre y Apellido</label></td>
                </tr>
                <tr style="height:10px;">
                    <td><input class="txt" id="nombre" name="nombre" type="text" placeholder="Ingresa tu nombre completo" required><br></td>
                </tr>
                <tr>
                    <td>&nbsp;</td>
                </tr>
                <tr style="height:10px;">
                    <td><label for="contacto" class="form-label">Correo Electrónico</label></td>
                </tr>
                <tr style="height:10px;">
                    <td><input class="txt" id="contacto" name="contacto" type="email" placeholder="ejemplo@gmail.com" required><br></td>
                </tr>
                <tr>
                    <td>&nbsp;</td>
                </tr>
                <tr style="height:10px;">
                    <td><label for="password" class="form-label">Contraseña</label></td>
                </tr>
                <tr>
                    <td><input class="txt" id="password" name="password" type="password" placeholder="Ingresa tu contraseña" required><br></td>
                </tr>
                <tr>
                    <td>&nbsp;</td>
                </tr>
                <tr>
                    <td>
                        <input id="termscondition" name="termscondition" type="checkbox" required>
                        <label for="termscondition" style="font-size: 14px;">Acepto los términos y condiciones del sistema</label>
                    </td>
                </tr>
                <tr>
                    <td><span id="resultadoRegistro" style="color:red;"></span></td>
                </tr>
            </table>
            <br>
            <button type="submit" id="btnEnviarRegistro">Registrarse</button>
            <p><a href="loginClient.html">Volver al Iniciar Sesión</a></p>
        </form>
    </center>

    <script src="registroCliente.js" type="module"></script>
</body>

</html>
