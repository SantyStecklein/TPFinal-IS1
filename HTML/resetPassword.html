<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa de Ayuda - Reset de Password</title>
    <style type="text/css">
        label { font-size: 18px; }
        form { width: 500px; border: 1px solid black; padding: 20px; }
        input { margin: 7px; padding: 5px; }
        .txt { display: inline-block; width: 80%; outline: none; }
    </style>
</head>
<body>
    <center>
        <img src="HelpDeskGirl.png" alt="Nuestra imagen corporativa" style="width:200px;height:150px;">
        <h1>Sistema de Mesa de Ayuda</h1>
        <h2>Restablecer Contraseña</h2>
    </center>

    <center>
        <form id="resetForm" style="background-color:#d8f7cf">
            <table>
                <tr>
                    <td><label for="contacto">Correo Electrónico</label></td>
                </tr>
                <tr>
                    <td><input class="txt" id="contacto" name="contacto" type="text" placeholder="ejemplo@correo.com" required></td>
                </tr>
                <tr><td>&nbsp;</td></tr>
                <tr>
                    <td><label for="password1">Nueva Contraseña</label></td>
                </tr>
                <tr>
                    <td><input class="txt" id="password1" name="password1" type="password" placeholder="Ingresa nueva contraseña" required></td>
                </tr>
                <tr><td>&nbsp;</td></tr>
                <tr>
                    <td><label for="password2">Repetir Nueva Contraseña</label></td>
                </tr>
                <tr>
                    <td><input class="txt" id="password2" name="password2" type="password" placeholder="Repite la nueva contraseña" required></td>
                </tr>
                <tr>
                    <td><span id="resultadoReset" style="color:red;"></span></td>
                </tr>
            </table>
            <br>
            <button type="button" id="btnReset">Cambiar Contraseña</button>
            <p><a href="loginClient.html">Volver a Iniciar Sesión</a></p>
        </form>
    </center>

    <script src="resetPassword.js" type="module"></script>
</body>
</html>
